name: Hut 8

description: 'Hut 8 is a Canadian cryptocurrency mining company that operates large-scale Bitcoin mining facilities. Founded in 2014, it focuses on sustainable mining practices, leveraging low-cost electricity and advanced hardware to secure the blockchain. The company provides transparency through regular reporting, offers mining services to institutional investors, and contributes to the growth of the digital asset ecosystem. Hut 8 is publicly listed on the Toronto Stock Exchange and engages with the broader crypto community through education and partnerships.'

